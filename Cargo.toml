[workspace]
members = [
    "crates/gridthorn",
    "crates/gridthorn_app",
    "crates/gridthorn_cli",
    "crates/gridthorn_render",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "MIT"
authors = ["Ivan Gromov"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
anyhow = "1.0.99"
clap = { version = "4.5.46", features = ["derive"] }
semver = "1.0.26"
serde = { version = "1.0.219", features = ["derive"] }
pollster = "0.4.0"
thiserror = "2.0.19"
toml = "0.9.5"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
wgpu = "26.0.1"
winit = "0.30.13"
