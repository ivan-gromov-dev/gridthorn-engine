[workspace]
members = [
    "crates/gridthorn",
    "crates/gridthorn_app",
    "crates/gridthorn_cli",
    "crates/gridthorn_input",
    "crates/gridthorn_render",
    "crates/gridthorn_simulation",
    "crates/gridthorn_world",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
authors = ["Ivan Gromov"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
anyhow = "1.0.99"
bevy_ecs = { version = "0.19.1", default-features = false, features = ["multi_threaded", "std"] }
clap = { version = "4.5.46", features = ["derive"] }
semver = "1.0.26"
serde = { version = "1.0.219", features = ["derive"] }
pollster = "1.0.1"
thiserror = "2.0.20"
toml = "1.1.4"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
wgpu = "30.0.1"
winit = "0.30.13"
windows = { version = "0.62.2", default-features = false }
