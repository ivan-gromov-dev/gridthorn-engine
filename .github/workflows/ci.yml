name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  verify:
    name: Verify (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
          - platform: macOS
            os: macos-latest
          - platform: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install controller backend build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Run repository checks (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Run repository checks (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: sh ./scripts/verify.sh

  msrv:
    name: MSRV 1.99.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install controller backend build prerequisites
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - name: Check all targets at the MSRV
        run: cargo check --workspace --all-targets --locked

  performance:
    name: Performance comparison (advisory)
    if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: current
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          path: previous
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Install controller backend build prerequisites
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            current -> ../performance/target-head
            previous -> ../performance/target-base
      - name: Test performance comparison policy
        run: python3 -m unittest discover -s current/scripts/performance/test
      - name: Compare previous and current release workloads
        run: sh current/scripts/performance.sh --baseline previous --current current --output performance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-comparison
          path: |
            performance/*.json
            performance/*.log
          retention-days: 14

  ci-success:
    name: CI Success
    if: always()
    needs:
      - verify
      - msrv
    runs-on: ubuntu-latest
    steps:
      - name: Confirm all required checks passed
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
        run: |
          if [ "$VERIFY_RESULT" != "success" ] || [ "$MSRV_RESULT" != "success" ]; then
            echo "Required checks did not all pass."
            exit 1
          fi
